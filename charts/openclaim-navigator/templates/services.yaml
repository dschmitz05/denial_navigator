{{- range $name := list "api" "ediparser" "rag" "llm" "frontend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "openclaim.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ if eq $name "frontend" }}80{{ else }}8000{{ end }}
      targetPort: http
---
{{- end }}
