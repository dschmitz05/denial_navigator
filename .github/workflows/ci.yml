name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 crates/api-gateway/openapi/generate.py --check
      - run: python3 scripts/check_docs_paths.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          # Gitea Actions doesn't support the actions/artifact v2+ protocol
          # this action's default artifact upload uses (GHESNotSupportedError),
          # so it always failed the step even though the SBOM generation
          # itself succeeded. The gate here is Trivy's scan of the tree, not
          # this file - see the next step for how the SBOM itself is kept.
          upload-artifact: false
      # Gitea has no artifact-download UI, but it does have a generic package
      # registry, which is a plain PUT/GET over HTTP. The built-in Actions
      # token can't authenticate to it (401 - confirmed by testing directly
      # against a live instance, not assumed), so this uses a dedicated
      # access token with write:package scope, stored as the PACKAGES_TOKEN
      # repo secret. Only push (not every PR) writes a version, named by
      # commit so `git log` and this registry stay correlated; a 409 on a
      # re-run of the same commit is expected and not a failure.
      - name: Retain the SBOM as release evidence
        if: github.event_name == 'push'
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: token ${{ secrets.PACKAGES_TOKEN }}" \
            --upload-file sbom.spdx.json \
            "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/denial-navigator-sbom/${{ github.sha }}/sbom.spdx.json")
          if [ "$status" != "201" ] && [ "$status" != "409" ]; then
            echo "SBOM publish failed with HTTP $status"
            exit 1
          fi
      # aquasecurity/trivy-action is a composite action that calls
      # aquasecurity/setup-trivy internally; that nested action call is
      # silently skipped on this runner (a known nektos/act limitation -
      # https://github.com/nektos/act/issues/107), so "Install Trivy" never
      # ran and the scan step then failed with "trivy: command not found".
      # Installing and running it directly sidesteps the nested-action
      # resolution entirely, with the same scan-type/severity/exit-code the
      # marketplace action would have passed through as flags/env either way.
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Run Trivy
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: cargo audit
        run: |
          # RUSTSEC-2023-0071 (rsa "Marvin Attack", no fixed upgrade exists)
          # reaches Cargo.lock only through sqlx-mysql's optional rsa
          # auth plugin. This workspace requests sqlx's "postgres" feature
          # only (see Cargo.toml); sqlx-mysql is never enabled and never
          # appears in a build output. See docs/dependency-policy.md.
          cargo audit --ignore RUSTSEC-2023-0071
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan the pushed commits for secrets
        run: |
          # Only the commits this push/PR introduces, not the whole history:
          # a secret from before this policy existed shouldn't block an
          # unrelated change from landing. `.gitleaks.toml` documents the one
          # allowlisted pattern (the test scripts' synthetic passwords).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range=""   # first push to a new default branch: nothing to diff
          fi
          if [ -n "$range" ]; then
            gitleaks detect --source . --log-opts="$range" --redact
          else
            gitleaks detect --source . --redact
          fi
