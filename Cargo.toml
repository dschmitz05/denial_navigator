[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/app",
    "crates/domain",
    "crates/audit",
    "crates/auth",
    "crates/db",
    "crates/denial-engine",
    "crates/edi-core",
    "crates/edi-835",
    "crates/edi-837",
    "crates/ai",
    "crates/knowledge",
    "crates/jobs",
    "crates/storage",
    "crates/test-support",
    "crates/api-gateway",
    "crates/llm-service",
    "crates/rag-engine",
    "crates/ediparser",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "json",
    "chrono",
    "uuid",
    "migrate",
    "bigdecimal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
bcrypt = "0.16"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "blocking",
    "rustls-tls",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
qrcode = { version = "0.14", features = ["svg"] }
ipnet = "2"
rand = "0.8"
futures = "0.3"
url = "2"
thiserror = "2"
anyhow = "1"
csv = "1"
html-escape = "0.2"
jetdb = "0.3"
tempfile = "3"
denial_common = { path = "crates/common" }
denial_app = { path = "crates/app" }
denial_domain = { path = "crates/domain" }
denial_audit = { path = "crates/audit" }
denial_auth = { path = "crates/auth" }
denial_db = { path = "crates/db" }
denial_engine = { path = "crates/denial-engine" }
denial_edi_core = { path = "crates/edi-core" }
denial_edi_835 = { path = "crates/edi-835" }
denial_edi_837 = { path = "crates/edi-837" }
denial_ai = { path = "crates/ai" }
denial_knowledge = { path = "crates/knowledge" }
denial_jobs = { path = "crates/jobs" }
denial_storage = { path = "crates/storage" }
denial_test_support = { path = "crates/test-support" }
