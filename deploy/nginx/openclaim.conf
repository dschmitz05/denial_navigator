# Install as /etc/nginx/conf.d/openclaim.conf on the host reverse proxy.
# Replace claims.example.org and the certificate paths before enabling.
server {
    listen 80;
    listen [::]:80;
    server_name claims.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name claims.example.org;

    ssl_certificate     /etc/letsencrypt/live/claims.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claims.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass_request_headers on;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
