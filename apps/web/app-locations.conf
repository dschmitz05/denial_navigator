# Everything the app serves, shared by the HTTP and HTTPS server blocks.
# Included from /etc/nginx/conf.d/default.conf, which docker-entrypoint.d/
# 05-tls.sh generates according to TLS_MODE.

    # Uploads are capped at 25 MB by the API. nginx defaults to 1 MB and
    # rejects anything larger itself, with a 413 that looks exactly like the
    # application's own limit - so a legitimate 2 MB remittance file or policy
    # PDF failed, and the app-level cap was never actually reached.
    client_max_body_size 26m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The API's own documentation, served from the gateway.
    #
    # These have to be named explicitly. Without them "location /" catches
    # them and try_files falls through to index.html, so /docs loaded the
    # React app, matched no route, and redirected to the dashboard - which
    # looks exactly like a broken link.
    #
    # Proxying rather than linking to host:8000 keeps it same-origin: no
    # guessing which hostname or port the browser reached us on, and no CORS.
    # Swagger's HTML pulls /openapi.json by absolute path, so that must be
    # proxied too or the page renders empty.
    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://api:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The vendored Swagger/ReDoc assets the doc pages reference. Same-origin,
    # so the docs work whether reached through here or on the gateway directly.
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
