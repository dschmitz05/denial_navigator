version: "3.9"

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER:-denial_nav}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-denial_nav_pass}
  POSTGRES_DB: ${POSTGRES_DB:-denial_navigator}
  PGVECTOR_ENABLE: "true"

services:
  # ─────────────────────────────────────────────
  # Database — PostgreSQL + pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: denial-navigator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-denial_nav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-denial_nav_pass}
      POSTGRES_DB: ${POSTGRES_DB:-denial_navigator}
    # Not published. Nothing outside the Docker network needs Postgres, and
    # exposing 5432 puts the whole PHI store on the LAN. Use
    # `docker exec denial-navigator-postgres psql -U denial_nav -d denial_navigator`,
    # or uncomment for a local database client.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/000-init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/100-migrations
      - ./database/seed:/docker-entrypoint-initdb.d/200-seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────
  # EDI Parser Service
  # ─────────────────────────────────────────────
  ediparser:
    build:
      context: ./ediparser
      dockerfile: Dockerfile
    container_name: denial-navigator-ediparser
    restart: unless-stopped
    # Internal only - reached by the gateway over the Docker network, and
    # surfaced through Settings -> Service Status. Uncomment to debug directly.
    # ports:
    #   - "127.0.0.1:8001:8000"
    volumes:
      - dropzone:/app/dropzone
      - ./ediparser/output:/app/output
    # The service no longer runs as root, so both the dropzone volume and the
    # ./ediparser/output bind mount must be writable by the image's app user.
    # The volume inherits that ownership from the image; the host directory
    # does not, and needs chowning once:
    #   docker run --rm -v "$PWD/ediparser:/e" alpine chown -R 100:101 /e/output
    user: "100:101"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-denial_nav}:${POSTGRES_PASSWORD:-denial_nav_pass}@postgres:5432/${POSTGRES_DB:-denial_navigator}
      DROPZONE_PATH: /app/dropzone
      OUTPUT_PATH: /app/output
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # RAG Engine Service
  # ─────────────────────────────────────────────
  rag-engine:
    build:
      context: ./rag-engine
      dockerfile: Dockerfile
    container_name: denial-navigator-rag
    restart: unless-stopped
    # Internal only - reached by the gateway over the Docker network, and
    # surfaced through Settings -> Service Status. Uncomment to debug directly.
    # ports:
    #   - "127.0.0.1:8002:8000"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-denial_nav}:${POSTGRES_PASSWORD:-denial_nav_pass}@postgres:5432/${POSTGRES_DB:-denial_navigator}
      LLAMA_BASE_URL: http://10.10.10.98:8080
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      # Embeddings come from Ollama, not the chat llama-server on :8080 -
      # that one answers /v1/embeddings with 501 "does not support embeddings".
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://10.10.10.98:11434}
      API_BASE: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # LLM Service
  # ─────────────────────────────────────────────
  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: denial-navigator-llm
    restart: unless-stopped
    # Internal only - reached by the gateway over the Docker network, and
    # surfaced through Settings -> Service Status. Uncomment to debug directly.
    # ports:
    #   - "127.0.0.1:8003:8000"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-denial_nav}:${POSTGRES_PASSWORD:-denial_nav_pass}@postgres:5432/${POSTGRES_DB:-denial_navigator}
      LLAMA_BASE_URL: http://10.10.10.98:8080
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      API_BASE: http://api:8000
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-true}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: denial-navigator-api
    restart: unless-stopped
    ports:
      # Loopback only: the browser reaches the API through the frontend's
      # TLS listener at /api/. This is for local scripting and curl, and
      # binding it to 127.0.0.1 keeps plain HTTP off the network.
      - "127.0.0.1:8000:8000"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-denial_nav}:${POSTGRES_PASSWORD:-denial_nav_pass}@postgres:5432/${POSTGRES_DB:-denial_navigator}
      EDIPARSER_SERVICE_URL: http://ediparser:8000
      RAG_ENGINE_URL: http://rag-engine:8000
      LLM_SERVICE_URL: http://llm-service:8000
      LLAMA_BASE_URL: http://10.10.10.98:8080
      # Health checks probe the embedding backend too; it is a separate
      # server from the chat one (see the rag-engine comment above).
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://10.10.10.98:11434}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ediparser:
        condition: service_started
      rag-engine:
        condition: service_started
      llm-service:
        condition: service_started

  # ─────────────────────────────────────────────
  # Frontend — React + Vite
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: denial-navigator-frontend
    restart: unless-stopped
    ports:
      - "3081:80"     # redirects to HTTPS
      - "3443:443"    # the application
    volumes:
      # Drop a trusted tls.crt / tls.key here to replace the self-signed pair.
      # Left empty, the entrypoint generates one on first start.
      - ./certs:/etc/nginx/certs
    environment:
      # self-signed (default) | provided | off — see frontend/docker-entrypoint.d/05-tls.sh
      TLS_MODE: ${TLS_MODE:-self-signed}
      # Name the generated certificate is issued for; use the hostname staff
      # will actually type, or the warning gets worse rather than better.
      TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
      # Host port 443 is published on, used only to build the HTTP redirect.
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-3443}
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  dropzone:
