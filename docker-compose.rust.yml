# The Rust rewrite as a full, self-contained stack, parallel to
# docker-compose.yml (the Python one). Different project name, container
# names, volumes and host ports, so both can run at once.
#
#   # secrets the Rust config refuses to start without:
#   #   JWT_SECRET, EDIPARSER_SERVICE_API_KEY, LLM_SERVICE_API_KEY,
#   #   EDIPARSER_INTERNAL_API_KEY, RAG_INTERNAL_API_KEY,
#   #   LLM_INTERNAL_API_KEY, TOTP_FERNET_KEY (>=16 chars, not placeholders)
#   printf 'TOTP_FERNET_KEY=%s\n' "$(openssl rand -base64 32)" >> .env
#
#   docker compose -f docker-compose.rust.yml up -d --build
#   # UI:  https://localhost:3444/     API: http://127.0.0.1:18000/
#   docker compose -f docker-compose.rust.yml down          # keep data
#   docker compose -f docker-compose.rust.yml down -v       # drop data

name: denialnav-rust

x-gateway-secrets: &gateway-secrets
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  DATABASE_URL: postgres://${POSTGRES_USER:-denial_nav}:${POSTGRES_PASSWORD:-denial_nav_pass}@postgres:5432/${POSTGRES_DB:-denial_navigator}

x-rust-build: &rust-build
  context: .
  dockerfile: Dockerfile.rust

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: denialnav-rust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-denial_nav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-denial_nav_pass}
      POSTGRES_DB: ${POSTGRES_DB:-denial_navigator}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-admin123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/docker-initdb.sh:/docker-entrypoint-initdb.d/00-run-all.sh:ro
      - ./database/init.sql:/opt/dn-sql/init.sql:ro
      - ./database/migrations:/opt/dn-sql/migrations:ro
      - ./database/seed:/opt/dn-sql/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-denial_nav} -d $${POSTGRES_DB:-denial_navigator}"]
      interval: 5s
      timeout: 3s
      retries: 15

  ediparser:
    build:
      <<: *rust-build
      target: ediparser
    image: denialnav-rust/ediparser
    container_name: denialnav-rust-ediparser
    restart: unless-stopped
    environment:
      EDIPARSER_SERVICE_API_KEY: ${EDIPARSER_SERVICE_API_KEY:?set EDIPARSER_SERVICE_API_KEY in .env}
      EDIPARSER_INTERNAL_API_KEY: ${EDIPARSER_INTERNAL_API_KEY:?set EDIPARSER_INTERNAL_API_KEY in .env}
      API_BASE: http://api:8000
      DROPZONE_PATH: /app/dropzone
      OUTPUT_PATH: /app/output
      PARSED_RETENTION_DAYS: ${PARSED_RETENTION_DAYS:-30}
      INGESTION_ORGANIZATION_ID: ${INGESTION_ORGANIZATION_ID:-00000000-0000-0000-0000-000000000001}
      SFTP_ENABLED: ${SFTP_ENABLED:-false}
      SFTP_HOST: ${SFTP_HOST:-}
      SFTP_PORT: ${SFTP_PORT:-22}
      SFTP_USERNAME: ${SFTP_USERNAME:-}
      SFTP_REMOTE_PATH: ${SFTP_REMOTE_PATH:-}
      SFTP_PRIVATE_KEY_PATH: ${SFTP_PRIVATE_KEY_PATH:-}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-}
      SFTP_HOST_PUBLIC_KEY_SHA256: ${SFTP_HOST_PUBLIC_KEY_SHA256:-}
      SFTP_POLL_SECONDS: ${SFTP_POLL_SECONDS:-60}
      S3_IMPORT_ENABLED: ${S3_IMPORT_ENABLED:-false}
      S3_IMPORT_ENDPOINT: ${S3_IMPORT_ENDPOINT:-}
      S3_IMPORT_BUCKET: ${S3_IMPORT_BUCKET:-}
      S3_IMPORT_REGION: ${S3_IMPORT_REGION:-us-east-1}
      S3_IMPORT_ACCESS_KEY_ID: ${S3_IMPORT_ACCESS_KEY_ID:-}
      S3_IMPORT_SECRET_ACCESS_KEY: ${S3_IMPORT_SECRET_ACCESS_KEY:-}
      S3_IMPORT_PREFIX: ${S3_IMPORT_PREFIX:-}
      S3_IMPORT_POLL_SECONDS: ${S3_IMPORT_POLL_SECONDS:-60}
    volumes:
      - dropzone:/app/dropzone
      - parsed_output:/app/output
    depends_on:
      postgres:
        condition: service_healthy

  rag-engine:
    build:
      <<: *rust-build
      target: rag-engine
    image: denialnav-rust/rag-engine
    container_name: denialnav-rust-rag
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-denial_nav}:${POSTGRES_PASSWORD:-denial_nav_pass}@postgres:5432/${POSTGRES_DB:-denial_navigator}
      RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY:?set RAG_INTERNAL_API_KEY in .env}
      API_BASE: http://api:8000
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://10.10.10.98:8080}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://10.10.10.98:8081}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBED_QUERY_PREFIX: ${EMBED_QUERY_PREFIX:-}
      EMBED_DOCUMENT_PREFIX: ${EMBED_DOCUMENT_PREFIX:-}
      VECTOR_SEARCH_ENABLED: ${VECTOR_SEARCH_ENABLED:-true}
      # The evidence cut, calibrated with scripts/eval_retrieval.py. Raising
      # MIN_SIMILARITY loses real policies before it stops weak ones: the
      # scores overlap. See docs/ARCHITECTURE.md.
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.62}
      RELATIVE_CUT: ${RELATIVE_CUT:-0.04}
      ANCHOR_MAX_SHARE: ${ANCHOR_MAX_SHARE:-0.25}
    depends_on:
      postgres:
        condition: service_healthy

  llm-service:
    build:
      <<: *rust-build
      target: llm-service
    image: denialnav-rust/llm-service
    container_name: denialnav-rust-llm
    restart: unless-stopped
    environment:
      LLM_SERVICE_API_KEY: ${LLM_SERVICE_API_KEY:?set LLM_SERVICE_API_KEY in .env}
      LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:?set LLM_INTERNAL_API_KEY in .env}
      API_BASE: http://api:8000
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://10.10.10.98:8080}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-auto}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-true}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      <<: *rust-build
      target: api-gateway
    image: denialnav-rust/api-gateway
    container_name: denialnav-rust-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"   # loopback only; the browser uses the frontend
    environment:
      <<: *gateway-secrets
      EDIPARSER_SERVICE_API_KEY: ${EDIPARSER_SERVICE_API_KEY:?set EDIPARSER_SERVICE_API_KEY in .env}
      LLM_SERVICE_API_KEY: ${LLM_SERVICE_API_KEY:?set LLM_SERVICE_API_KEY in .env}
      EDIPARSER_INTERNAL_API_KEY: ${EDIPARSER_INTERNAL_API_KEY:?set EDIPARSER_INTERNAL_API_KEY in .env}
      RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY:?set RAG_INTERNAL_API_KEY in .env}
      LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:?set LLM_INTERNAL_API_KEY in .env}
      TOTP_FERNET_KEY: ${TOTP_FERNET_KEY:?set TOTP_FERNET_KEY in .env (openssl rand -base64 32)}
      EDIPARSER_SERVICE_URL: http://ediparser:8000
      RAG_ENGINE_URL: http://rag-engine:8000
      LLM_SERVICE_URL: http://llm-service:8000
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://10.10.10.98:8080}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://10.10.10.98:8081}
      AI_DEGRADED_THRESHOLD: ${AI_DEGRADED_THRESHOLD:-0.2}
      # `local` remains the default. To use the optional MinIO profile, set
      # OBJECT_STORAGE_BACKEND=s3 and retain the internal minio endpoint.
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_S3_ENDPOINT: ${OBJECT_STORAGE_S3_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_S3_BUCKET: ${OBJECT_STORAGE_S3_BUCKET:-denial-artifacts}
      OBJECT_STORAGE_S3_REGION: ${OBJECT_STORAGE_S3_REGION:-us-east-1}
      OBJECT_STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CORS_ORIGINS: ${CORS_ORIGINS_RUST:-https://localhost:3444}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-127.0.0.1/32,172.16.0.0/12,10.0.0.0/8}
    depends_on:
      postgres:
        condition: service_healthy
      ediparser:
        condition: service_started
      rag-engine:
        condition: service_started
      llm-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:18000
    image: denialnav-rust/frontend
    container_name: denialnav-rust-frontend
    restart: unless-stopped
    ports:
      - "3082:80"     # redirects to HTTPS
      - "3444:443"    # the application
    volumes:
      - ./certs-rust:/etc/nginx/certs
    environment:
      TLS_MODE: ${TLS_MODE:-self-signed}
      TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
      PUBLIC_HTTPS_PORT: "3444"
    depends_on:
      api:
        condition: service_healthy

  # Optional S3-compatible object storage for production-like development.
  # The core services remain usable with the local filesystem backend when
  # this profile is not enabled.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["object-storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Compose interpolates profile services even when the profile is off;
      # development defaults therefore keep the base stack bootable. Production
      # deployments must override both values (see the security checklist).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Optional development/test OIDC issuer. It is deliberately profile-gated:
  # production must use the organisation's managed identity provider instead.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    profiles: ["oidc"]
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      # Compose interpolates profile services even while disabled. Keep these
      # empty by default so the core stack remains bootable; the `oidc` profile
      # must be started with both variables set.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./infra/keycloak/realm-denial-navigator.json:/opt/keycloak/data/import/realm-denial-navigator.json:ro
      - keycloak_data:/opt/keycloak/data

# Pin the project's network. Left to Docker, Compose walks the default address
# pool (172.17, .18, .19 ...) and on 2026-09-09 it landed on 172.20.0.0/16 -
# which contains the DMZ VLAN (172.20.3.0/24) and the IoT VLAN
# (172.20.66.0/24). Every packet to the media host, Gitea, TrueNAS and the
# Denial Navigator VM was then routed into this bridge and dropped. An explicit
# subnet makes the network deterministic instead of dependent on the order
# projects happen to start in.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  dropzone:
  parsed_output:
  minio_data:
  keycloak_data:
